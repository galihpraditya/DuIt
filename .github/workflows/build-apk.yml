name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*' # Memicu rilis saat push tag seperti v1.0.0
  workflow_dispatch: # Memungkinkan klik tombol "Run workflow" manual di GitHub

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Bundle & Sync Capacitor
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          npx cap sync android

      - name: Make Gradle Executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK File
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk release-output/DuIt-Wallet-${{ github.ref_name || 'latest' }}.apk

      # Upload artifact agar bisa diunduh langsung dari halaman Actions
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuIt-Android-APK
          path: release-output/*.apk
          retention-days: 14

      # Publikasikan ke halaman GitHub Releases jika dipicu oleh Git Tag
      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-output/DuIt-Wallet-*.apk
          name: DuIt Wallet ${{ github.ref_name }}
          body: |
            ## DuIt Expense Tracker - ${{ github.ref_name }}
            
            Versi terbaru aplikasi DuIt dengan sinkronisasi cloud real-time dan analitik finansial.
            
            ### Cara Pasang di Android:
            1. Unduh file `DuIt-Wallet-${{ github.ref_name }}.apk` di bawah.
            2. Buka file di perangkat Android Anda dan pilih Install.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
