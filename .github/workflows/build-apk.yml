name: Build and Release Android APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*' # Memicu rilis otomatis saat push tag versi seperti v1.0.0
  workflow_dispatch: # Memungkinkan klik tombol "Run workflow" manual di GitHub Actions

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Bundle & Sync Capacitor
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL || 'https://duit-wallet.vercel.app' }}
        run: |
          npm run build
          npx cap sync android

      - name: Make Gradle Executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Prepare APK Files
        run: |
          mkdir -p release-output
          SAFE_REF=$(echo "${{ github.ref_name || 'latest' }}" | tr '/' '-')

          # Salin APK Release (yang sudah ditandatangani)
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "release-output/DuIt-Wallet-${SAFE_REF}.apk"
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "release-output/DuIt-Wallet-${SAFE_REF}-unsigned.apk"
          fi

          # Salin APK Debug untuk testing
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "release-output/DuIt-Wallet-debug.apk"
          fi

          echo "Daftar file APK yang dihasilkan:"
          ls -la release-output/

      # Upload artifact agar bisa diunduh langsung dari tab Actions di setiap build
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuIt-Android-APK
          path: release-output/*.apk
          retention-days: 14

      # Publikasikan ke halaman GitHub Releases jika dipicu oleh Git Tag
      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-output/DuIt-Wallet-*.apk
          name: DuIt Wallet ${{ github.ref_name }}
          body: |
            ## DuIt Expense Tracker - ${{ github.ref_name }}
            
            Versi terbaru aplikasi DuIt dengan sinkronisasi cloud real-time dan analitik finansial.
            
            ### Cara Pasang di Android:
            1. Unduh file `DuIt-Wallet-${{ github.ref_name }}.apk` di bawah.
            2. Buka file di perangkat Android Anda dan pilih Install.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
